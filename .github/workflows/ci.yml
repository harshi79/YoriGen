name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage
          retention-days: 7
          if-no-files-found: warn

  build:
    name: Production build and static server
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs the strict TypeScript gate before bundling.
      - name: Build
        run: npm run build

      - name: Static server integration tests
        run: npm run test:server

      # The Android app bundle (packaged into the APK by the Android workflow).
      - name: Mobile bundle
        run: npm run build:mobile

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t origen:ci .

      # Smoke-test the image the same way a platform would: start it, then hit
      # the health endpoint the Dockerfile HEALTHCHECK uses.
      - name: Smoke-test the container
        run: |
          docker run -d --name origen-ci -p 8080:8080 origen:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "healthz OK after ${attempt}s"
              curl -fsS http://127.0.0.1:8080/healthz
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs origen-ci
          exit 1

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: >-
          npx playwright test --project=desktop --project=mobile --project=android
          --reporter=list,json

      # Job logs are not readable through the API, so failures are surfaced as
      # check annotations too, which are.
      - name: Surface failures as check annotations
        if: always()
        run: |
          node --input-type=module -e '
          import { readFileSync, existsSync } from "node:fs";
          if (!existsSync("playwright-results.json")) { console.log("no JSON report written"); process.exit(0); }
          const report = JSON.parse(readFileSync("playwright-results.json", "utf8"));
          const failures = [];
          const walk = (node, trail) => {
            for (const spec of node.specs ?? []) {
              for (const test of spec.tests ?? []) {
                for (const result of test.results ?? []) {
                  if (result.status !== "failed" && result.status !== "timedOut") continue;
                  const message = String(result.error?.message ?? "no message")
                    .replace(/\u001b\[[0-9;]*m/g, "").replace(/[\r\n]+/g, " ").slice(0, 300);
                  failures.push({ title: `${test.projectName} > ${[...trail, spec.title].join(" > ")}`.slice(0, 200), message });
                }
              }
            }
            for (const child of node.suites ?? []) walk(child, [...trail, child.title]);
          };
          for (const suite of report.suites ?? []) walk(suite, []);
          console.log(`failed tests: ${failures.length}`);
          for (const failure of failures.slice(0, 25)) {
            console.log(`::error title=${failure.title}::${failure.message}`);
          }
          '

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: warn
